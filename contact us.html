<!-- went on youtube to find a contact form i can follow but then got stucked in a css part and asked chatgpt to help me with it then final part of the vid was to make the form work, so the form does send me a real email (Web3form)-->

    <div class="contact-section">
        <div class="contact-box">
            <h2>Contact Us</h2>
            <form action="https://api.web3forms.com/submit" method="POST">
                <input type="hidden" name="access_key" value="6fe9b3b6-32b2-489d-8c12-2dae97b57cf6">
                <input type="text" name="name"
                placeholder="Your Name" required>
                <input type="email" name="email"
                placeholder="Your Email"  required>
                <textarea
                name="message"
                rows="6"
                placeholder="Your Message"></textarea>
                <button type="submit">
                    Send Message
                </button>
            </form>
